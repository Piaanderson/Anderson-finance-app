services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: currents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - currents-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d currents"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  currents-postgres:
